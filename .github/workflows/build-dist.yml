name: Build distributable archive

on:
  push:
    branches:
      - modernize-1.1.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<pi_version>\(.*\)</pi_version>.*:\1:p' plugin.xml | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Unable to read pi_version from plugin.xml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building AmazonLinks $VERSION"

      - name: Build installable ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf build
          mkdir -p build/amazonlinks dist

          rsync -a ./ build/amazonlinks/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='build/'

          rm -f "dist/amazonlinks-${VERSION}.zip"
          (
            cd build
            zip -r -q "../dist/amazonlinks-${VERSION}.zip" amazonlinks
          )

          echo "Created dist/amazonlinks-${VERSION}.zip"
          unzip -l "dist/amazonlinks-${VERSION}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazonlinks-${{ steps.version.outputs.version }}
          path: dist/amazonlinks-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Commit updated archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/amazonlinks-${VERSION}.zip"

          if git diff --cached --quiet; then
            echo "Archive unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Build AmazonLinks ${VERSION} distributable [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
